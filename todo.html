<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDoリスト</title>
<style>
  body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 24px 16px; }
  main { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  h1 { margin: 0 0 16px; font-size: 22px; }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 16px; }
  input[type="text"], input[type="date"] { padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 4px; }
  .due-row { grid-column: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555; }
  .due-row input { flex: 1; }
  .due { display: block; font-size: 12px; color: #666; }
  .due.overdue { color: #dc2626; font-weight: bold; }
  button { padding: 8px 12px; font-size: 14px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
  button.delete { background: #dc2626; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; word-break: break-all; }
  li.done span { text-decoration: line-through; color: #999; }
  .empty { color: #888; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<main>
  <h1>ToDoリスト</h1>
  <form id="form">
    <input type="text" id="input" placeholder="やることを入力" autocomplete="off">
    <button type="submit">追加</button>
    <label class="due-row">期限 <input type="date" id="due"></label>
  </form>
  <ul id="list"></ul>
</main>

<script>
  // やることの一覧（画面を閉じても残るよう、ブラウザの保存領域に入れる）
  var todos = [];
  try { todos = JSON.parse(localStorage.getItem("todos")) || []; } catch (e) {}

  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var dueInput = document.getElementById("due");
  var list = document.getElementById("list");

  // 今日の日付を「2026-10-08」の形で返す
  function today() {
    var d = new Date();
    var m = ("0" + (d.getMonth() + 1)).slice(-2);
    var day = ("0" + d.getDate()).slice(-2);
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function save() {
    try { localStorage.setItem("todos", JSON.stringify(todos)); } catch (e) {}
  }

  function render() {
    list.innerHTML = "";
    if (todos.length === 0) {
      list.innerHTML = '<li class="empty">やることはありません</li>';
      return;
    }
    todos.forEach(function (todo, i) {
      var li = document.createElement("li");
      if (todo.done) li.className = "done";

      var check = document.createElement("input");
      check.type = "checkbox";
      check.checked = todo.done;
      check.onchange = function () { todo.done = check.checked; save(); render(); };

      var text = document.createElement("span");
      text.textContent = todo.text;

      if (todo.due) {
        var due = document.createElement("small");
        due.className = "due";
        due.textContent = "期限: " + todo.due;
        // 期限を過ぎていて未完了なら赤字にする
        if (!todo.done && todo.due < today()) due.classList.add("overdue");
        text.appendChild(due);
      }

      var del = document.createElement("button");
      del.className = "delete";
      del.textContent = "削除";
      del.onclick = function () { todos.splice(i, 1); save(); render(); };

      li.append(check, text, del);
      list.appendChild(li);
    });
  }

  form.onsubmit = function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    todos.push({ text: value, due: dueInput.value, done: false });
    input.value = "";
    dueInput.value = "";
    save();
    render();
  };

  render();
</script>
</body>
</html>
